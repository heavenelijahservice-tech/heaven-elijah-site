<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Heaven Elijah Service">
  <title>Heaven Elijah Service</title>

  <!-- Cercle avec deux interruptions à droite (haut et bas) où passent les barres du H -->
  <path d="M 60 14
           A 46 46 0 0 1 102 38
           M 102 82
           A 46 46 0 0 1 60 106
           A 46 46 0 0 1 14 60
           A 46 46 0 0 1 60 14 Z"
        fill="none" stroke="#f5efe0" stroke-width="4.5"/>

  <!-- Barre gauche du H -->
  <rect x="40" y="8" width="15" height="104" fill="#f5efe0" rx="1.5"/>

  <!-- Barre droite du H -->
  <rect x="65" y="8" width="15" height="104" fill="#f5efe0" rx="1.5"/>

  <!-- Crossbar -->
  <rect x="46" y="54" width="28" height="12" fill="#f5efe0"/>

  <!-- Hélice ADN — double brin orange épais -->
  <g stroke="#f09042" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- Brin A : sinusoïdal -->
    <path d="M 55 28
             C 70 36, 70 46, 55 54
             C 40 62, 40 72, 55 80
             C 70 88, 70 94, 55 96"/>
    <!-- Brin B : sinusoïdal opposé -->
    <path d="M 65 28
             C 50 36, 50 46, 65 54
             C 80 62, 80 72, 65 80
             C 50 88, 50 94, 65 96"/>
  </g>

  <!-- Bandeau crossbar par-dessus l'hélice -->
  <rect x="55" y="54" width="10" height="12" fill="#f5efe0"/>
</svg>
